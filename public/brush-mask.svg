<svg viewBox="0 0 200 400" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="brush">
      <feTurbulence type="fractalNoise" baseFrequency="0.06 0.12" numOctaves="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="40" xChannelSelector="R" yChannelSelector="G" />
      <!-- Enhance the contrast to make the edges solid and not semi-transparent -->
      <feComponentTransfer>
        <feFuncA type="linear" slope="5" intercept="-2"/>
      </feComponentTransfer>
    </filter>
  </defs>
  <rect x="15" y="15" width="170" height="370" fill="black" filter="url(#brush)" />
</svg>
